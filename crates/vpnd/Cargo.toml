[package]
name = "vpnd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ipnet = { version = "2.12.2", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "io-util"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tun-rs = { version = "2.8.18", features = ["async"] }
vpn-proto = { version = "0.3.0", path = "../vpn-proto" }
zeroize = "1.9.1"

[target.'cfg(target_os = "linux")'.dependencies]
caps = "0.5.6"
nix = { version = "0.31.3", features = ["user", "process", "socket", "uio", "net"] }
rtnetlink = "0.24.0"
futures-util = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
route_manager = "0.2.17"
