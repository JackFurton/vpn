[package]
name = "vpn-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
blake2 = "0.11.0"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
curve25519-dalek = "4.1.3"
getrandom = "0.4.3"
ipnet = "2.12.2"
snow = { version = "0.10.0", default-features = false, features = ["default-resolver", "use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom", "risky-raw-split"] }
thiserror = "2.0.21"
tracing = "0.1.44"
zeroize = { version = "1.9.1", features = ["derive"] }
