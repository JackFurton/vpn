#!/usr/sbin/nft -f
# NAT and forwarding for a vpnd exit node. Load with: nft -f nftables-exit.conf
# Set WAN to the server's internet-facing interface and TUNNEL to the subnet
# in [interface] addresses.

define WAN = "eth0"
define VPN = "tun0"
define TUNNEL = 10.8.0.0/24

table inet vpnd
delete table inet vpnd

table inet vpnd {
    chain forward {
        type filter hook forward priority filter; policy accept;

        # TCP SYNs crossing the tunnel get their MSS lowered to fit the
        # tunnel MTU, so TCP never sends segments that would need
        # fragmenting. Without this, sites that drop ICMP "fragmentation
        # needed" hang on large responses.
        oifname $VPN tcp flags syn tcp option maxseg size set rt mtu
        iifname $VPN tcp flags syn tcp option maxseg size set rt mtu
    }

    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;

        # Clients' tunnel addresses mean nothing on the internet, so rewrite
        # the source to the server's own address on the way out. conntrack
        # remembers the mapping and undoes it on the replies.
        ip saddr $TUNNEL oifname $WAN masquerade
    }
}
