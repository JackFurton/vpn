name: Bench

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/vpn-proto/benches/**"
      - "tests/bench.sh"
      - ".github/workflows/bench.yml"

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq iperf3 wireguard-tools
      - run: cargo build --release -p vpnd --locked
      - run: grep -rlE "profile wg[ ,]" /etc/apparmor.d | xargs -r cat
      - run: sudo bash -x tests/bench.sh target/release/vpnd
      - if: failure()
        run: sudo dmesg | grep -i -E "apparmor|denied" | tail -20
      - run: cargo bench -p vpn-proto --bench transport --locked
