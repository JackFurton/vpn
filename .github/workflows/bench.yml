name: Bench

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/vpn-proto/benches/**"
      - "tests/bench.sh"
      - "tests/bench-macos.sh"
      - ".github/workflows/bench.yml"

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq iperf3 wireguard-tools
      - run: cargo build --release -p vpnd --locked
      - run: sudo tests/bench.sh target/release/vpnd
      - run: cargo bench -p vpn-proto --bench transport --locked
      - name: TEMP A/B against main
        run: |
          git fetch -q origin main
          git worktree add -q ../base origin/main
          cargo build -q --release --locked --manifest-path ../base/Cargo.toml -p vpnd
          for round in 1 2 3; do
            for v in main branch; do
              echo "### $v"
              if [ $v = main ]; then bin=../base/target/release/vpnd; else bin=target/release/vpnd; fi
              sudo tests/bench.sh $bin 8
            done
          done

  bench-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p vpnd --bins --examples --locked
      - run: sudo tests/bench-macos.sh target/release/vpnd target/release/examples/echo_peer
