name: Bench

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/vpn-proto/benches/**"
      - "tests/bench.sh"
      - "tests/bench-macos.sh"
      - ".github/workflows/bench.yml"

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq iperf3 wireguard-tools
      - run: cargo build --release -p vpnd --locked
      - run: sudo tests/bench.sh target/release/vpnd
      - run: cargo bench -p vpn-proto --bench transport --locked

  bench-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p vpnd --bins --examples --locked
      - run: sudo tests/bench-macos.sh target/release/vpnd target/release/examples/echo_peer
      - name: TEMP profile
        run: |
          sudo tests/bench-macos.sh target/release/vpnd target/release/examples/echo_peer 12 &
          sleep 6
          pid=$(pgrep -f 'vpnd up' | head -1)
          sudo sample "$pid" 4 -file /tmp/vpnd.sample > /dev/null 2>&1 || true
          wait
          sed -n '/Sort by top of stack/,/Binary Images/p' /tmp/vpnd.sample | head -45
